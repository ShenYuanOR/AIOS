[package]
name = "motherd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "motherd"
path = "src/main.rs"

[[bin]]
name = "motherctl"
path = "src/ctl.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rustyline = "14"
toml = { version = "0.8", default-features = false, features = ["parse"] }
crossterm = "0.28"
ratatui = "0.29"
unicode-width = "0.2"
